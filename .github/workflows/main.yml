name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Build TWA APK
        run: |
          git clone https://github.com/chromeos/pwa-to-twa.git
          cd pwa-to-twa
          cat > config.json << 'EOF'
          {
            "packageId": "io.github.platypuspaw.twa",
            "host": "platypuspaw.github.io",
            "name": "HolaTuki",
            "startUrl": "/Spanish-app/index.html",
            "themeColor": "#0e0c1a",
            "backgroundColor": "#0e0c1a",
            "iconUrl": "https://platypuspaw.github.io/Spanish-app/launchericon-512x512.png"
          }
          EOF
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HolaTuki-APK
          path: pwa-to-twa/app/build/outputs/apk/release/*.apk
