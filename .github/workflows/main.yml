name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Install llama-pack
        run: npm install -g @llama-pack/cli

      - name: Build APK
        run: |
          llama-pack init --manifest https://platypuspaw.github.io/Spanish-app/manifest.json --directory /tmp/twa
          cd /tmp/twa
          llama-pack build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HolaTuki-APK
          path: /tmp/twa/app-release-unsigned.apk
