name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone TWA Quickstart
        run: git clone https://github.com/GoogleChromeLabs/svgomg-twa.git twa

      - name: Configure TWA
        run: |
          cd twa
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 33
              defaultConfig {
                  applicationId "io.github.platypuspaw.twa"
                  minSdkVersion 19
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

      - name: Build APK
        run: |
          cd twa
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HolaTuki-APK
          path: twa/app/build/outputs/apk/release/app-release-unsigned.apk
