name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build TWA APK
        uses: BandhiyaHardik/twa-build-action@main
        with:
          manifest-url: 'https://platypuspaw.github.io/Spanish-app/manifest.json'
          app-name: 'HolaTuki'
          package-name: 'io.github.platypuspaw.twa'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HolaTuki-APK
          path: '*.apk'
